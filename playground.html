html,body{height:100%;overflow:hidden;background:#eef1ff;font-family:'JetBrains Mono',monospace}

.hud.tl{top:18px;left:18px;line-height:1.9}
.hud.tr{top:18px;right:18px;display:flex;gap:10px;align-items:center}
.hud a,.hud button{color:#2b4bff;text-decoration:none;background:#fff;border:1px solid #e4e4e7;padding:8px 14px;border-radius:999px;font-family:inherit;font-size:12px;cursor:pointer}

#speedo{position:fixed;bottom:18px;left:18px;z-index:5;font-size:12px;color:#86868b}
#coins{position:fixed;bottom:18px;right:18px;z-index:5;font-size:12px;color:#b8860b}
#banner{

  font-size:clamp(30px,6vw,64px);font-weight:700;letter-spacing:.2em;color:#2b4bff;
  opacity:0;transition:opacity .4s,transform .4s;pointer-events:none;text-shadow:0 4px 30px rgba(43,75,255,.3);

#banner.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#zonecard{

#zonecard h4{font-size:14px;letter-spacing:.1em;margin-bottom:8px;color:#2b4bff}
#zonecard a{color:#2b4bff}
.touch{position:fixed;bottom:70px;right:22px;z-index:5;display:none;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(2,54px);gap:8px}
.touch button{border:1px solid #d5d7e6;background:#ffffffcc;border-radius:12px;font-size:18px;color:#1d1d1f;touch-action:none}
.touch .u{grid-column:2}.touch .l{grid-column:1;grid-row:2}.touch .d{grid-column:2;grid-row:2}.touch .r{grid-column:3;grid-row:2}
.touch .b{grid-column:1;grid-row:1}
@media (pointer:coarse){.touch{display:grid}}

// label texture
function labelTex(text,fg='#1d1d1f',bg='#ffffff',fs=54){
  const c=document.createElement('canvas');c.width=512;c.height=256;
  const x=c.getContext('2d');
  x.fillStyle=bg;x.fillRect(0,0,512,256);
  x.strokeStyle='#e4e4e7';x.lineWidth=8;x.strokeRect(4,4,504,248);
  x.fillStyle=fg;x.font=`700 ${fs}px JetBrains Mono, monospace`;
  x.textAlign='center';x.textBaseline='middle';
  const lines=text.split('\n');
  lines.forEach((l,i)=>x.fillText(l,256,128+(i-(lines.length-1)/2)*fs*1.25));
  const t=new THREE.CanvasTexture(c);t.anisotropy=4;return t;
}

// dynamic knockables
const dyn=[];
function knockable(mesh,x,z,r){
  mesh.position.x=x;mesh.position.z=z;
  mesh.castShadow=true;mesh.receiveShadow=true;
  mesh.userData={vel:new THREE.Vector3(),ang:0,home:mesh.position.clone(),homeRot:mesh.rotation.clone(),r,cool:0};
  scene.add(mesh);dyn.push(mesh);return mesh;
}
function crate(w,h,d,x,z,text,color='#ffffff',fg='#1d1d1f'){
  const side=new THREE.MeshStandardMaterial({map:labelTex(text,fg,color)});
  const plain=new THREE.MeshStandardMaterial({color:new THREE.Color(color)});
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),[side,side,plain,plain,side,side]);
  m.position.y=h/2;
  return knockable(m,x,z,Math.max(w,d)/2);
}

}

    m.rotation.x=-ang;

    m.rotation.z=ang;
  }
  m.position.set(r.x,r.h/2,r.z);
  m.castShadow=true;m.receiveShadow=true;scene.add(m);

function rampHeight(x,z){
  let y=0;
  for(const r of ramps){
    const u=(r.dir==='z')?(z-r.z):(x-r.x);
    const v=(r.dir==='z')?(x-r.x):(z-r.z);
    if(Math.abs(v)<r.w/2 && u>-r.l/2 && u<r.l/2){
      y=Math.max(y,(u+r.l/2)/r.l*r.h);
    }
  }
  return y;
}

// audio
let AC=null,engine=null,engGain=null;
function initAudio(){
  if(AC) return;
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    engine=AC.createOscillator();engine.type='sawtooth';
    const filt=AC.createBiquadFilter();filt.type='lowpass';filt.frequency.value=320;
    engGain=AC.createGain();engGain.gain.value=0;
    engine.connect(filt);filt.connect(engGain);engGain.connect(AC.destination);
    engine.start();
  }catch(e){}
}
let lastThunk=0;
function thunk(){
  if(!AC) return;
  const t=AC.currentTime;
  if(t-lastThunk<.08) return;
  lastThunk=t;
  const o=AC.createOscillator(),g=AC.createGain();
  o.type='triangle';o.frequency.setValueAtTime(110,t);
  o.frequency.exponentialRampToValueAtTime(40,t+.12);
  g.gain.setValueAtTime(.25,t);g.gain.exponentialRampToValueAtTime(.001,t+.15);
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+.16);
}
function ding(){
  if(!AC) return;
  const t=AC.currentTime;
  const o=AC.createOscillator(),g=AC.createGain();
  o.type='sine';o.frequency.setValueAtTime(880,t);
  g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.001,t+.35);
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+.36);
}

  const k=b.dataset.k;
  b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=1});
  b.addEventListener('pointerup',()=>keys[k]=0);
  b.addEventListener('pointerleave',()=>keys[k]=0);
});
function reset(){
  car.position.set(0,0,6);car.rotation.set(0,0,0);speed=0;vy=0;
  dyn.forEach(m=>{m.position.copy(m.userData.home);m.rotation.copy(m.userData.homeRot);m.userData.vel.set(0,0,0);m.userData.ang=0;});
  strikeDone=false;
  ball.position.copy(ballHome);ballVel.set(0,0,0);
}

// ---- loop ----
let speed=0,vy=0,boostT=0,airborne=false,climbRate=0;
const speedo=document.getElementById('speedo');
const fwd=new THREE.Vector3();
function tick(){
  requestAnimationFrame(tick);
  const drifting=!!keys.brake && Math.abs(speed)>.12;
  const accel=.012, maxS=boostT>0?.85:.55;
  if(keys.up) speed+=accel*(boostT>0?1.6:1);
  if(keys.down) speed-=accel*.8;
  const fric=drifting?.985:.965;
  speed=Math.max(-maxS*.5,Math.min(maxS,speed))*fric;
  if(boostT>0)boostT--;

  const steer=(keys.left?1:0)-(keys.right?1:0);
  const steerPow=drifting?.06:.035;
  car.rotation.y+=steer*steerPow*Math.min(Math.abs(speed)/.15,1)*Math.sign(speed||1);
  fwd.set(Math.sin(car.rotation.y),0,Math.cos(car.rotation.y));
  car.position.addScaledVector(fwd,-speed*2);

  // walls
  const lim=HALF-2.4;
  if(Math.abs(car.position.x)>lim||Math.abs(car.position.z)>lim){
    car.position.x=Math.max(-lim,Math.min(lim,car.position.x));
    car.position.z=Math.max(-lim,Math.min(lim,car.position.z));
    if(Math.abs(speed)>.2)thunk();
    speed*=.5;
  }

  // ramps / air (proper launch)
  const gy=rampHeight(car.position.x,car.position.z);
  if(airborne){
    vy-=.022;
    car.position.y+=vy;
    car.rotation.x=THREE.MathUtils.lerp(car.rotation.x,-vy*.8,.1);
    if(car.position.y<=gy){
      car.position.y=gy;airborne=false;vy=0;car.rotation.x=0;
      if(Math.abs(speed)>.25)thunk();
    }
  }else{
    const prevY=car.position.y;
    car.position.y=gy;
    const dy=gy-prevY;
    if(dy<-0.25 && Math.abs(speed)>.18){
      // drove off an edge — launch!
      airborne=true;
      car.position.y=prevY;
      vy=climbRate*1.1+Math.abs(speed)*.32;
    }else{
      climbRate=Math.max(dy,0);
    }
  }

  // boost pad
  if(Math.hypot(car.position.x-boost.x,car.position.z-boost.z)<boost.r&&boostT<=0){
    boostT=60;ding();
  }
  boostMesh.rotation.z+=.02;

  wheels.forEach(w=>w.rotation.x-=speed*.9);
  car.rotation.z=THREE.MathUtils.lerp(car.rotation.z,steer*speed*(drifting?.35:.15),.1);

  // skid marks
  if(drifting&&car.position.y<.05)skid();
  for(let i=skids.length-1;i>=0;i--){
    skids[i].material.opacity-=.0015;
    if(skids[i].material.opacity<=0){scene.remove(skids[i]);skids.splice(i,1);}
  }

  // knockables
  dyn.forEach(m=>{
    const u=m.userData;
    const dx=m.position.x-car.position.x, dz=m.position.z-car.position.z;
    const dist=Math.hypot(dx,dz), rr=u.r+2.2;
    if(dist<rr&&Math.abs(speed)>.05&&car.position.y<1){
      const push=(rr-dist)*.5+Math.abs(speed)*1.6;
      u.vel.x+=dx/dist*push*.4;u.vel.z+=dz/dist*push*.4;
      u.ang+=(Math.random()-.5)*.25*Math.abs(speed)*8;
      u.cool=240;thunk();
    }
    m.position.add(u.vel);
    m.rotation.y+=u.ang;
    // keep inside box
    m.position.x=Math.max(-lim,Math.min(lim,m.position.x));
    m.position.z=Math.max(-lim,Math.min(lim,m.position.z));
    u.vel.multiplyScalar(.9);u.ang*=.9;
    // float home after cooldown
    if(u.cool>0)u.cool--;
    else{
      m.position.lerp(u.home,.006);
      m.rotation.y+=(u.homeRot.y-m.rotation.y)*.006;
    }
  });

  // bowling strike check
  if(!strikeDone){
    const down=pins.filter(p=>p.position.distanceTo(p.userData.home)>2).length;
    if(down===pins.length){
      strikeDone=true;
      showBanner('STRIKE!','#e63b2e');
      burst(-24,36);ding();
    }
  }

  // coins
  coins.forEach(c=>{
    if(!c.visible)return;
    c.rotation.y+=.04;
    if(Math.hypot(c.position.x-car.position.x,c.position.z-car.position.z)<2.2){
      c.visible=false;collected++;updateCoinHud();ding();
      if(collected===coins.length){
        showBanner('ALL COINS — ACCESS GRANTED','#f2c14e');
        burst(car.position.x,car.position.z);
      }
    }
  });

  // confetti
  for(let i=confetti.length-1;i>=0;i--){
    const c=confetti[i],u=c.userData;
    u.v.y-=.015;c.position.add(u.v);
    c.rotation.x+=.2;c.rotation.y+=.15;
    if(--u.life<=0||c.position.y<0){scene.remove(c);confetti.splice(i,1);}
  }

  // football physics
  {
    const dx=ball.position.x-car.position.x, dz=ball.position.z-car.position.z;
    const dist=Math.hypot(dx,dz);
    if(dist<3.4&&Math.abs(speed)>.04){
      const kick=Math.abs(speed)*2.2+(3.4-dist)*.3;
      ballVel.x+=dx/dist*kick*.35;ballVel.z+=dz/dist*kick*.35;
      thunk();
    }
    ball.position.add(ballVel);
    if(Math.abs(ball.position.x)>lim-1){ballVel.x*=-.75;ball.position.x=Math.sign(ball.position.x)*(lim-1);}
    if(Math.abs(ball.position.z)>lim-1){ballVel.z*=-.75;ball.position.z=Math.sign(ball.position.z)*(lim-1);}
    ballVel.multiplyScalar(.985);
    ball.rotation.x+=ballVel.z*.6;ball.rotation.z-=ballVel.x*.6;
    if(goalCooldown>0)goalCooldown--;
    if(goalCooldown<=0&&Math.abs(ball.position.x-30)<3&&ball.position.z>45.2){
      goalCooldown=180;
      showBanner('GOAL!','#2fbf71');burst(30,44);ding();
      setTimeout(()=>{ball.position.copy(ballHome);ballVel.set(0,0,0);},1500);
    }
  }

  // zone cards
  {
    let z=null;
    for(const zn of zones){
      if(Math.hypot(car.position.x-zn.x,car.position.z-zn.z)<zn.r){z=zn;break;}
    }
    if(z&&activeZone!==z.id){activeZone=z.id;zonecard.innerHTML=z.html;zonecard.classList.add('show');}
    else if(!z&&activeZone){activeZone=null;zonecard.classList.remove('show');}
  }

  // speed FOV
  const targetFov=60+Math.abs(speed)*26;
  if(Math.abs(camera.fov-targetFov)>.1){camera.fov+=(targetFov-camera.fov)*.08;camera.updateProjectionMatrix();}

  // engine sound
  if(engGain){
    engGain.gain.value=Math.min(Math.abs(speed)*.35,.14);
    engine.frequency.value=55+Math.abs(speed)*260;
  }

  // camera
  const camTarget=new THREE.Vector3(
    car.position.x+Math.sin(car.rotation.y)*14,
    9+car.position.y*.5,
    car.position.z+Math.cos(car.rotation.y)*14
  );
  camera.position.lerp(camTarget,.06);
  camera.lookAt(car.position.x,1.5+car.position.y,car.position.z);

  speedo.textContent='SPEED '+Math.round(Math.abs(speed)*180)+' KM/H'+(boostT>0?' ⚡':'')+(drifting?' — DRIFT':'');
  renderer.render(scene,camera);
}
tick();
})();
</script>
</body>
</html>
